name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.428'
      - name: Build portable WinUI 3 executable
        shell: pwsh
        run: .\build.ps1 -DotNetPath (Get-Command dotnet).Source
      - name: Verify receiver regressions
        shell: pwsh
        run: .\tests\Run-Engine.ps1 -DotNetPath (Get-Command dotnet).Source
      - name: Verify download and runtime packaging
        shell: pwsh
        run: .\scripts\Test-BuildScripts.ps1
      - name: Upload executable and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AirMirror-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
